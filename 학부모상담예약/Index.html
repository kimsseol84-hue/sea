<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 한 줄 세로 흐름 — 날짜 칩 → 시간 격자 → 신청서 → 확인/취소 → 관리자 */
  :root {
    --bg: #f3f6f4;
    --paper: #ffffff;
    --ink: #1f2a27;
    --muted: #5d6b67;
    --line: #d8e1dd;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --accent-soft: #e2efe9;
    --taken: #eceeed;
    --taken-ink: #9aa5a1;
    --warn: #b3412e;
    --warn-soft: #fbe9e5;
    --font-display: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a18; --paper: #1c2421; --ink: #e6ece9; --muted: #9eaca7; --line: #2e3a36;
      --accent: #7cc4ad; --accent-ink: #0f1a16; --accent-soft: #233630;
      --taken: #222a27; --taken-ink: #5f6d68; --warn: #f08d78; --warn-soft: #3a221d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 22px; }
  h1, h2 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; }
  h1 { font-size: 1.75rem; line-height: 1.3; }
  h2 { font-size: 1.15rem; }
  .eyebrow { display: inline-block; font-size: .8rem; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; }
  .meta { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
  .notice { margin: 10px 0 0; white-space: pre-line; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
  .step { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .day { flex: 0 0 auto; text-align: left; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: inherit; cursor: pointer; min-width: 112px; }
  .day small { display: block; color: var(--muted); font-size: .78rem; }
  .day[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .day:disabled { cursor: default; color: var(--taken-ink); background: var(--taken); }
  .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .time { font: 500 1rem var(--font-body); font-variant-numeric: tabular-nums; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
  .time small { display: block; font-size: .72rem; font-weight: 400; color: var(--muted); }
  .time[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .time[aria-pressed="true"] small { color: var(--accent-ink); }
  .time:disabled { background: var(--taken); color: var(--taken-ink); cursor: not-allowed; text-decoration: line-through; }
  .time:disabled small { text-decoration: none; color: var(--taken-ink); }
  .picked { font-family: var(--font-display); font-size: 1.2rem; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); }
  .picked.empty { font-family: var(--font-body); font-size: .95rem; color: var(--muted); background: transparent; border: 1px dashed var(--line); }
  label { display: grid; gap: 4px; font-size: .9rem; font-weight: 500; }
  label span.opt { font-weight: 400; color: var(--muted); }
  input, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 72px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
  button.primary { font: 700 1rem var(--font-body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 13px; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: wait; }
  button.ghost { font: inherit; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: .92rem; }
  .msg.err { background: var(--warn-soft); color: var(--warn); }
  .done { text-align: center; gap: 6px; }
  .done .code { font: 700 2.4rem var(--font-body); letter-spacing: .3em; font-variant-numeric: tabular-nums; color: var(--accent); }
  details summary { cursor: pointer; font-weight: 500; }
  details[open] summary { margin-bottom: 12px; }
  .inline { display: flex; gap: 8px; flex-wrap: wrap; }
  .inline input { flex: 1 1 140px; width: auto; }
  .empty-note { color: var(--muted); font-size: .92rem; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  footer { text-align: center; }
  footer button { background: none; border: 0; color: var(--muted); font: inherit; font-size: .85rem; text-decoration: underline; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) { .time, .day { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="eyebrow" id="className" hidden></span>
    <h1 id="title">학부모 상담 신청</h1>
    <p class="meta" id="meta">일정을 불러오는 중이에요…</p>
    <p class="notice" id="notice" hidden></p>
  </header>

  <div class="msg err" id="closed" hidden>지금은 상담 신청을 받지 않고 있어요.</div>

  <section class="panel" id="bookPanel" hidden>
    <div class="step">1. 날짜 고르기</div>
    <div class="days" id="days" role="group" aria-label="상담 날짜"></div>
    <div class="step">2. 시간 고르기</div>
    <div class="times" id="times" role="group" aria-label="상담 시간"></div>
    <div class="step">3. 신청 내용</div>
    <div class="picked empty" id="picked">날짜와 시간을 먼저 골라 주세요.</div>
    <form id="form" novalidate>
      <div style="display:grid; gap:12px">
        <div class="row2">
          <label for="child">아이 이름<input id="child" autocomplete="off" maxlength="20" placeholder="예: 김하늘"></label>
          <label for="guardian">보호자<input id="guardian" autocomplete="off" maxlength="20" placeholder="예: 엄마"></label>
        </div>
        <label for="phone" id="phoneLabel" hidden>연락처<input id="phone" type="tel" inputmode="tel" maxlength="20" placeholder="010-0000-0000"></label>
        <label for="memo">상담 때 나누고 싶은 이야기 <span class="opt">(선택)</span><textarea id="memo" maxlength="200" placeholder="예: 친구 관계, 식습관"></textarea></label>
        <div class="msg err" id="formErr" hidden></div>
        <button class="primary" id="submit" type="submit" disabled>상담 신청하기</button>
      </div>
    </form>
  </section>

  <section class="panel done" id="donePanel" hidden>
    <h2>신청이 완료됐어요</h2>
    <div class="picked" id="doneWhen"></div>
    <p class="meta">확인번호</p>
    <div class="code" id="doneCode"></div>
    <p class="meta">예약을 확인하거나 취소할 때 이 번호가 필요해요.<br>화면을 캡처해 두세요.</p>
    <button class="ghost" id="again" type="button">처음 화면으로</button>
  </section>

  <section class="panel">
    <details id="mineBox">
      <summary>내 예약 확인 · 취소</summary>
      <div style="display:grid; gap:10px">
        <div class="inline">
          <input id="mineChild" placeholder="아이 이름" maxlength="20" aria-label="아이 이름">
          <input id="mineCode" placeholder="확인번호 4자리" inputmode="numeric" maxlength="4" aria-label="확인번호">
          <button class="ghost" id="mineFind" type="button">조회</button>
        </div>
        <div id="mineResult" hidden></div>
      </div>
    </details>
  </section>

  <section class="panel" id="adminPanel" hidden>
    <div class="inline" style="justify-content:space-between; align-items:center">
      <h2>신청자 명단</h2>
      <button class="ghost" id="adminRefresh" type="button">새로고침</button>
    </div>
    <p class="meta" id="adminSummary"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>날짜</th><th>시간</th><th>아이</th><th>보호자</th><th id="thPhone">연락처</th><th>요청사항</th></tr></thead>
      <tbody id="adminRows"></tbody>
    </table></div>
    <p class="meta">취소·수정은 구글 시트 "예약현황"에서 상태를 "취소"로 바꾸면 돼요. 날짜·시간·반 이름은 "설정"과 "일정" 시트에서 바꿉니다.</p>
  </section>

  <footer>
    <div class="inline" id="adminLogin" hidden style="justify-content:center; margin-bottom:8px">
      <input id="adminCode" type="password" inputmode="numeric" placeholder="관리자 코드" aria-label="관리자 코드" style="max-width:180px">
      <button class="ghost" id="adminGo" type="button">명단 보기</button>
    </div>
    <div class="msg err" id="adminErr" hidden></div>
    <button id="adminToggle" type="button">관리자</button>
  </footer>
</main>

<script>
  var state = { data: null, date: null, time: null, adminCode: '' };
  var $ = function (id) { return document.getElementById(id); };

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || '연결이 불안정해요. 잠시 뒤 다시 시도해 주세요.'));
      });
      r[fn].apply(r, args);
    });
  }

  function showErr(el, text) { el.textContent = text; el.hidden = !text; }

  function load() {
    return call('getPublicData').then(function (d) {
      state.data = d;
      document.title = d.title;
      $('title').textContent = d.title;
      $('className').textContent = d.className;
      $('className').hidden = !d.className;
      var meta = [];
      if (d.teacher) meta.push('담임 ' + d.teacher);
      if (d.minutes) meta.push('상담 ' + d.minutes + '분');
      $('meta').textContent = meta.join(' · ');
      $('meta').hidden = !meta.length;
      $('notice').textContent = d.notice;
      $('notice').hidden = !d.notice;
      $('phoneLabel').hidden = !d.askPhone;
      $('closed').hidden = d.open;
      $('bookPanel').hidden = !d.open || !$('donePanel').hidden;

      var stillThere = d.days.some(function (x) { return x.date === state.date; });
      if (!stillThere) { state.date = (d.days.filter(function (x) { return x.left > 0; })[0] || {}).date || null; state.time = null; }
      render();
    }).catch(function (e) {
      $('meta').textContent = e.message;
    });
  }

  function render() {
    var d = state.data;
    var days = $('days');
    days.textContent = '';
    if (!d.days.length) {
      var p = document.createElement('p');
      p.className = 'empty-note';
      p.textContent = '아직 열린 상담 일정이 없어요. 선생님이 일정을 올리면 여기에 보여요.';
      days.appendChild(p);
    }
    d.days.forEach(function (day) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'day';
      b.setAttribute('aria-pressed', String(day.date === state.date));
      b.disabled = day.left === 0;
      b.textContent = day.label;
      var s = document.createElement('small');
      s.textContent = day.left === 0 ? '마감' : day.left + '자리 남음';
      b.appendChild(s);
      b.onclick = function () { state.date = day.date; state.time = null; render(); };
      days.appendChild(b);
    });

    var times = $('times');
    times.textContent = '';
    var day = d.days.filter(function (x) { return x.date === state.date; })[0];
    if (day) {
      day.times.forEach(function (t) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'time';
        b.disabled = t.taken;
        b.setAttribute('aria-pressed', String(t.time === state.time));
        b.textContent = t.time;
        var s = document.createElement('small');
        s.textContent = t.taken ? '신청 완료' : '가능';
        b.appendChild(s);
        b.onclick = function () { state.time = t.time; render(); };
        times.appendChild(b);
      });
    }

    var picked = $('picked');
    if (day && state.time) {
      picked.className = 'picked';
      picked.textContent = day.label + ' ' + state.time + (d.minutes ? ' (' + d.minutes + '분)' : '');
    } else {
      picked.className = 'picked empty';
      picked.textContent = '날짜와 시간을 먼저 골라 주세요.';
    }
    $('submit').disabled = !(day && state.time);
  }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    showErr($('formErr'), '');
    var btn = $('submit');
    btn.disabled = true;
    btn.textContent = '신청하는 중…';
    call('book', {
      date: state.date, time: state.time,
      child: $('child').value, guardian: $('guardian').value,
      phone: $('phone').value, memo: $('memo').value
    }).then(function (res) {
      $('doneWhen').textContent = res.label + ' ' + res.time;
      $('doneCode').textContent = res.code;
      $('bookPanel').hidden = true;
      $('donePanel').hidden = false;
      $('form').reset();
      state.time = null;
      window.scrollTo(0, 0);
      return load();
    }).catch(function (e) {
      showErr($('formErr'), e.message);
      return load();
    }).then(function () {
      btn.textContent = '상담 신청하기';
      render();
    });
  });

  $('again').onclick = function () {
    $('donePanel').hidden = true;
    $('bookPanel').hidden = !state.data.open;
    load();
  };

  $('mineFind').onclick = function () {
    var box = $('mineResult');
    box.hidden = false;
    box.className = 'meta';
    box.textContent = '찾는 중…';
    var child = $('mineChild').value, code = $('mineCode').value;
    call('findMyBooking', child, code).then(function (b) {
      box.className = '';
      box.textContent = '';
      var p = document.createElement('div');
      p.className = 'picked';
      p.textContent = b.child + ' · ' + b.label + ' ' + b.time;
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'ghost';
      c.textContent = '이 예약 취소하기';
      c.style.marginTop = '10px';
      c.onclick = function () {
        if (c.dataset.armed !== '1') { c.dataset.armed = '1'; c.textContent = '정말 취소할까요? 한 번 더 누르세요'; return; }
        c.disabled = true;
        call('cancelMyBooking', child, code).then(function () {
          box.className = 'meta';
          box.textContent = '취소했어요. 다른 시간으로 다시 신청할 수 있어요.';
          load();
        }).catch(function (e) { box.className = 'msg err'; box.textContent = e.message; });
      };
      box.appendChild(p);
      box.appendChild(c);
    }).catch(function (e) { box.className = 'msg err'; box.textContent = e.message; });
  };

  $('adminToggle').onclick = function () { $('adminLogin').hidden = !$('adminLogin').hidden; if (!$('adminLogin').hidden) $('adminCode').focus(); };
  $('adminCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('adminGo').click(); });
  $('adminGo').onclick = function () { state.adminCode = $('adminCode').value; loadAdmin(); };
  $('adminRefresh').onclick = function () { loadAdmin(); load(); };

  function loadAdmin() {
    showErr($('adminErr'), '');
    call('getAdminData', state.adminCode).then(function (a) {
      $('adminLogin').hidden = true;
      $('adminPanel').hidden = false;
      $('adminSummary').textContent = '신청 ' + a.list.length + '건 · 남은 일정 ' + a.upcomingSlots + '칸 중';
      var showPhone = state.data && state.data.askPhone;
      $('thPhone').hidden = !showPhone;
      var tb = $('adminRows');
      tb.textContent = '';
      if (!a.list.length) {
        var tr0 = document.createElement('tr');
        var td0 = document.createElement('td');
        td0.colSpan = 6;
        td0.className = 'empty-note';
        td0.textContent = '아직 신청이 없어요.';
        tr0.appendChild(td0);
        tb.appendChild(tr0);
      }
      a.list.forEach(function (r) {
        var tr = document.createElement('tr');
        [[r.label, 'num'], [r.time, 'num'], [r.child], [r.guardian], [r.phone, 'num', !showPhone], [r.memo]].forEach(function (c) {
          var td = document.createElement('td');
          td.textContent = c[0] || '';
          if (c[1]) td.className = c[1];
          td.hidden = !!c[2];
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      $('adminPanel').scrollIntoView({ behavior: 'smooth' });
    }).catch(function (e) { showErr($('adminErr'), e.message); });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.data) load(); });
  load();
</script>
</body>
</html>
